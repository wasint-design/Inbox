<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MuvMi – Support Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #F0F2F7; }
  </style>
</head>
<body class="antialiased">

<div class="mx-auto max-w-[430px] min-h-screen bg-[#F0F2F7] flex flex-col">

  <!-- iOS Status Bar -->
  <div class="flex items-center justify-between px-4 pt-3 pb-1 shrink-0">
    <span class="text-[17px] font-semibold">9:37</span>
    <div class="w-20"></div>
    <div class="flex items-center gap-[5px]">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="black">
        <rect x="0" y="7" width="3" height="5" rx="1"/>
        <rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/>
        <rect x="9" y="2" width="3" height="10" rx="1"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="black">
        <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
        <path d="M3.5 6.3A6.5 6.5 0 0 1 12.5 6.3" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M1 3.7A10 10 0 0 1 15 3.7" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="black" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="16" height="8" rx="2" fill="black"/>
        <path d="M23 4v4a2 2 0 0 0 0-4z" fill="black" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Title -->
  <div class="px-5 pt-8 pb-6">
    <h1 class="text-[28px] font-bold text-[#1A1F36] leading-tight">Support Center</h1>
  </div>

  <!-- Cards -->
  <div class="px-4 flex flex-col gap-4">

    <!-- Messages -->
    <button onclick="window.location.href='index.html'"
      class="w-full bg-white rounded-[20px] px-5 py-5 flex items-center gap-4 shadow-sm active:bg-gray-50 transition-colors text-left">
      <div class="w-14 h-14 rounded-[16px] bg-[#E7EEFC] flex items-center justify-center shrink-0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0D57E2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[17px] font-bold text-[#1A1F36] leading-6">Messages</p>
        <p class="text-[13px] text-[#909090] mt-0.5 leading-[18px]">ข่าวสารและสอบถามการใช้งาน</p>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" class="shrink-0">
        <path d="M1 1l6 6-6 6" stroke="#C0C0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Trip Chat -->
    <button onclick="window.location.href='trip-map.html'"
      class="w-full bg-white rounded-[20px] px-5 py-5 flex items-center gap-4 shadow-sm active:bg-gray-50 transition-colors text-left">
      <div class="w-14 h-14 rounded-[16px] bg-[#FFF0E8] flex items-center justify-center shrink-0">
        <svg width="30" height="22" viewBox="0 0 30 22" fill="none">
          <path d="M2 13h26M6 17.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0zm15 0a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0z" stroke="#E8622A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 13V9a2 2 0 0 1 2-2h4L10 4h10l2 3h4a2 2 0 0 1 2 2v4" stroke="#E8622A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[17px] font-bold text-[#1A1F36] leading-6 flex items-center gap-2">
          Trip Chat
          <span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span>
        </p>
        <p class="text-[13px] text-[#909090] mt-0.5 leading-[18px]">แจ้งปัญหาการเดินทางทริปปัจจุบัน</p>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" class="shrink-0">
        <path d="M1 1l6 6-6 6" stroke="#C0C0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  </div>

</div>
</body>
</html>
