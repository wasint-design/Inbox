<!DOCTYPE html>

<head>

  <title>MuvMi Chat - Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f3f4f6; }
    #chat-area { scroll-behavior: smooth; overscroll-behavior-y: none; }
    .bubble-in { animation: fadeUp 0.2s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    input:disabled { cursor: not-allowed; }
    #pull-arrow { transition: transform 0.2s ease; }
    #pull-indicator.snapping { transition: height 0.25s ease, opacity 0.25s ease; }
  </style>
</head>

// ─── Avatar ───────────────────────────────────────────────────────────────────
function avatarEl() {
  return `<div class="w-11 h-11 rounded-full bg-[#0D57E2] flex items-center justify-center shrink-0 self-start mt-1">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="9" r="4" fill="white"/>
      <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </div>`;
}

// ─── Bubble builders ──────────────────────────────────────────────────────────
function appendBotBubble(innerHTML) {
  const el = document.createElement("div");
  el.className = "flex items-start gap-3 bubble-in";
  el.innerHTML = `${avatarEl()}
    <div class="bg-[#E7EEFC] rounded-[16px] rounded-tl-sm px-4 py-3 max-w-[76%] flex flex-col gap-3">
      ${innerHTML}
    </div>`;
  chatArea.appendChild(el);
  scrollBottom();
  return el;
}

function appendUserBubble(text) {
  const el = document.createElement("div");
  el.className = "flex justify-end bubble-in";
  el.innerHTML = `<div class="bg-[#0D57E2] rounded-[16px] rounded-tr-sm px-4 py-3 max-w-[76%]">
    <p class="text-[14px] font-semibold text-white leading-[22px] tracking-[0.25px]">${escHtml(text)}</p>
  </div>`;
  chatArea.appendChild(el);
  scrollBottom();
}

function hideBubble(el) {
  if (!el) return;
  el.classList.add("hidden");
}

// ─── Menu helpers ─────────────────────────────────────────────────────────────
function pillsHTML(items, fnName, ...prefixArgs) {
  const pfx = prefixArgs.length ? prefixArgs.join(", ") + ", " : "";
  return items.map((item, i) =>
    `<button onclick="${fnName}(this, ${pfx}${i})"
      class="w-full bg-white rounded-full px-4 py-2 text-[14px] font-semibold text-[#4F4F4F] tracking-[0.25px] text-center active:bg-gray-100 transition-colors">
      ${escHtml(item.label)}
    </button>`
  ).join("");
}

// ─── Leaf flow ────────────────────────────────────────────────────────────────
function runLeaf(item) {
  if (item.gather) {
    flowState = { item, stepIdx: 0 };
    appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(item.initial)}</p>`);
    setTimeout(() => advanceFlow(), 600);
  } else {
    appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(item.response)}</p>`);
    resetToDefault();
  }
}

function advanceFlow() {
  if (!flowState) return;
  const { item, stepIdx } = flowState;
  if (stepIdx >= item.gather.length) {
    if (item.closing) appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(item.closing)}</p>`);
    flowState = null;
    resetToDefault();
    return;
  }
  const step = item.gather[stepIdx];
  if (step.type === "tripPicker") {
    showTripPicker(step.prompt);
  } else {
    appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(step.prompt)}</p>`);
    enableInput();
  }
}

function selectTrip(btn, idx) {

// ─── Input ────────────────────────────────────────────────────────────────────
function enableInput() {
  textInput.disabled = false;

  menuBtn.disabled = false;
  textInput.focus();

function resetToDefault() {
  textInput.disabled = true;

  sendBtn.disabled = true;
  menuBtn.disabled = false;
}

function disableInput() {
  textInput.disabled = true;
  textInput.value = "";
  textInput.placeholder = "Please select topic above first";
  menuBtn.disabled = true;
  sendBtn.disabled = true;
}

function sendMessage() {
  const val = textInput.value.trim();
  if (!val || textInput.disabled) return;
  textInput.value = "";
  appendUserBubble(val);
  if (flowState) {
    textInput.disabled = true;
    textInput.placeholder = "Please select topic above first";
    flowState.stepIdx++;
    setTimeout(() => advanceFlow(), 800);
  } else {
    textInput.disabled = true;
    sendBtn.disabled = true;
    setTimeout(() => {
      appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">ขอบคุณครับ ทีมงานได้รับข้อความแล้ว จะติดต่อกลับโดยเร็วที่สุดครับ</p>`);

// ─── Pull to load older messages ─────────────────────────────────────────────
const pullIndicator = document.getElementById("pull-indicator");
const pullArrow     = document.getElementById("pull-arrow");
const pullText      = document.getElementById("pull-text");

const PULL_THRESHOLD = 64;
let touchStartY = 0;
let touchLastY  = 0;
let pulling     = false;
let loadingOld  = false;

const OLDER_PAGES = [
  [
    { type: "date", text: "28 พ.ค. 2569" },
    { type: "bot",  text: "สวัสดีครับ มีอะไรให้น้อง Muvmi ช่วยเหลือครับ" },
    { type: "bot",  text: "สามารถเลือกหัวข้อที่ต้องการสอบถามจากเมนูด้านล่างได้เลยครับ!" },
    { type: "user", text: "เช็กโปรโมชั่น" },
    { type: "user", text: "แพ็กเกจ Voucher" },
    { type: "bot",  text: "แพ็กเกจ Voucher เดือนนี้: เติม 200 บาท รับ Voucher ส่วนลด 30 บาท จำนวน 3 ใบ ใช้ได้ถึง 31 พ.ค. 2569 ครับ" },
  ],
  [
    { type: "date", text: "15 พ.ค. 2569" },
    { type: "bot",  text: "สวัสดีครับ มีอะไรให้น้อง Muvmi ช่วยเหลือครับ" },
    { type: "user", text: "แจ้งลืมของหรือสัมภาระ" },
    { type: "bot",  text: "รับทราบการแจ้ง ขอให้ช่วยอธิบายรายละเอียดครับ" },
    { type: "user", text: "ลืมกระเป๋าผ้าสีน้ำตาลบนรถครับ" },
    { type: "bot",  text: "เมื่อไหร่ที่ลืมครับ?" },
    { type: "user", text: "ช่วงเที่ยงประมาณ 12:30 น." },
    { type: "bot",  text: "เราจะติดตามกับพนักงาน โปรดรอติดต่อจากเราครับ" },
  ],
];
let olderPage = 0;

function onPullStart(y) {
  if (chatArea.scrollTop > 0 || loadingOld || olderPage >= OLDER_PAGES.length) return;
  touchStartY = y;
  touchLastY  = y;
  pulling = true;
}
function onPullMove(y) {
  if (!pulling) return;
  touchLastY = y;
  const dist = Math.max(0, touchLastY - touchStartY);
  pullIndicator.style.height  = Math.min(dist * 0.45, 48) + "px";
  pullIndicator.style.opacity = Math.min(dist / PULL_THRESHOLD, 1);
  if (dist >= PULL_THRESHOLD) {
    pullArrow.style.transform = "rotate(180deg)";
    pullText.textContent = "ปล่อยเพื่อโหลด";
  } else {
    pullArrow.style.transform = "rotate(0deg)";
    pullText.textContent = "ดึงเพื่อดูแชทเก่า";
  }
}
function onPullEnd() {
  if (!pulling) return;
  pulling = false;
  const dist = Math.max(0, touchLastY - touchStartY);
  if (dist >= PULL_THRESHOLD) startLoadOlder();
  else snapIndicator(false);
}

// Touch
chatArea.addEventListener("touchstart", e => onPullStart(e.touches[0].clientY), { passive: true });
chatArea.addEventListener("touchmove",  e => onPullMove(e.touches[0].clientY),  { passive: true });
chatArea.addEventListener("touchend",   () => onPullEnd());

// Mouse (desktop)
chatArea.addEventListener("mousedown",  e => onPullStart(e.clientY));
window.addEventListener("mousemove",    e => onPullMove(e.clientY));
window.addEventListener("mouseup",      () => onPullEnd());

function startLoadOlder() {
  loadingOld = true;
  pullIndicator.style.height  = "44px";
  pullIndicator.style.opacity = "1";
  pullArrow.style.display = "none";
  pullText.textContent = "กำลังโหลด...";
  setTimeout(() => {
    loadOlderPage();
    loadingOld = false;
    pullArrow.style.display = "";
    pullArrow.style.transform = "rotate(0deg)";
    pullText.textContent = olderPage < OLDER_PAGES.length ? "ดึงเพื่อดูแชทเก่า" : "ไม่มีแชทเก่าแล้ว";
    if (olderPage >= OLDER_PAGES.length) document.getElementById("older-hint").classList.add("hidden");
    snapIndicator(false);
  }, 700);
}

function snapIndicator(show) {
  pullIndicator.classList.add("snapping");
  pullIndicator.style.height  = show ? "44px" : "0";
  pullIndicator.style.opacity = show ? "1"    : "0";
  setTimeout(() => pullIndicator.classList.remove("snapping"), 280);
}

function loadOlderPage() {
  if (olderPage >= OLDER_PAGES.length) return;
  const msgs  = OLDER_PAGES[olderPage++];
  const prevH = chatArea.scrollHeight;
  const frag  = document.createDocumentFragment();
  msgs.forEach(m => { const el = makeOldMsgEl(m); if (el) frag.appendChild(el); });
  chatArea.insertBefore(frag, chatArea.firstChild);
  chatArea.scrollTop = chatArea.scrollHeight - prevH;
}

function makeOldMsgEl(m) {
  const el = document.createElement("div");
  if (m.type === "date") {
    el.className = "flex justify-center";
    el.innerHTML = `<span class="text-[12px] font-semibold text-[#909090] bg-gray-100 px-3 py-1 rounded-full">${escHtml(m.text)}</span>`;
  } else if (m.type === "bot") {
    el.className = "flex items-start gap-3";
    el.innerHTML = `${avatarEl()}
      <div class="bg-[#E7EEFC] rounded-[16px] rounded-tl-sm px-4 py-3 max-w-[76%]">
        <p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(m.text)}</p>
      </div>`;
  } else if (m.type === "user") {
    el.className = "flex justify-end";
    el.innerHTML = `<div class="bg-[#0D57E2] rounded-[16px] rounded-tr-sm px-4 py-3 max-w-[76%]">
      <p class="text-[14px] font-semibold text-white leading-[22px] tracking-[0.25px]">${escHtml(m.text)}</p>
    </div>`;
  } else { return null; }
  return el;
}
