<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MuvMi Chat - Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f3f4f6; }
    #chat-area { scroll-behavior: smooth; }
    .bubble-in { animation: fadeUp 0.2s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    input:disabled { cursor: not-allowed; }
  </style>
</head>
<body class="antialiased">

<div class="mx-auto max-w-[430px] h-screen bg-white shadow-md flex flex-col overflow-hidden">

  <!-- iOS Status Bar -->
  <div class="flex items-center justify-between px-4 pt-3 pb-1 shrink-0">
    <span class="text-[17px] font-semibold">9:41</span>
    <div class="w-20"></div>
    <div class="flex items-center gap-[5px]">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="black">
        <rect x="0" y="7" width="3" height="5" rx="1"/>
        <rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/>
        <rect x="9" y="2" width="3" height="10" rx="1"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="black">
        <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
        <path d="M3.5 6.3A6.5 6.5 0 0 1 12.5 6.3" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M1 3.7A10 10 0 0 1 15 3.7" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="black" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="16" height="8" rx="2" fill="black"/>
        <path d="M23 4v4a2 2 0 0 0 0-4z" fill="black" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Navigation Bar -->
  <div class="flex items-center justify-center relative h-14 border-b border-black/[0.08] shadow-[0px_1px_0px_rgba(0,0,0,0.08)] shrink-0">
    <button onclick="window.location.href='index.html'" class="absolute left-4 flex items-center justify-center w-6 h-6">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none">
        <path d="M9.5 1L1.5 9L9.5 17" stroke="#0D57E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="text-[20px] font-semibold text-[#4F4F4F] leading-[30px]">Inbox</h1>
  </div>

  <!-- Tabs -->
  <div class="flex shrink-0 border-b border-[#E7EEFC]">
    <button onclick="window.location.href='index.html'"
      class="flex-1 h-[46px] flex items-center justify-center text-[16px] font-semibold tracking-[0.25px] text-[#4F4F4F]">
      Message
    </button>
    <button class="flex-1 h-[46px] flex items-center justify-center text-[16px] font-semibold tracking-[0.25px] text-[#0D57E2] border-b-2 border-[#0D57E2]">
      Support
    </button>
  </div>

  <!-- Chat Area -->
  <div id="chat-area" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-4"></div>

  <!-- Input Bar -->
  <div class="shrink-0 bg-white border-t border-[#E7EEFC] p-4">
    <div class="flex items-center gap-2">
      <button id="menu-btn" onclick="showMainMenu()"
        class="shrink-0 px-4 py-1 rounded-full text-[14px] font-semibold tracking-[0.25px] bg-[#E7EEFC] border border-[#E7EEFC] text-[#0D57E2] whitespace-nowrap disabled:opacity-30 disabled:cursor-not-allowed">
        Menu
      </button>
      <input id="text-input" type="text" disabled
        placeholder="Please select topic above first"
        class="flex-1 min-w-0 bg-[#EEE] border border-[#909090] rounded-full px-4 py-1 text-[14px] text-[#909090] placeholder-[#909090] outline-none transition-all
               disabled:bg-[#EEE] disabled:border-[#909090] disabled:text-[#909090]
               enabled:bg-white enabled:border-[#0D57E2] enabled:text-[#4F4F4F] enabled:placeholder-gray-400"
        onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="send-btn" onclick="sendMessage()" disabled class="shrink-0 w-8 h-8 flex items-center justify-center disabled:opacity-30">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#0D57E2">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

</div>

// ─── State ────────────────────────────────────────────────────────────────────
const chatArea  = document.getElementById("chat-area");
const textInput = document.getElementById("text-input");
const menuBtn   = document.getElementById("menu-btn");
const sendBtn   = document.getElementById("send-btn");
let flowState = null; // { item, stepIdx }
let currentChoiceBubble = null;

// ─── Avatar ───────────────────────────────────────────────────────────────────
function avatarEl() {
  return `<div class="w-11 h-11 rounded-full bg-[#0D57E2] flex items-center justify-center shrink-0 self-start mt-1">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="9" r="4" fill="white"/>
      <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </div>`;
}

// ─── Bubble builders ──────────────────────────────────────────────────────────
function appendBotBubble(innerHTML) {
  const el = document.createElement("div");
  el.className = "flex items-start gap-3 bubble-in";
  el.innerHTML = `${avatarEl()}
    <div class="bg-[#E7EEFC] rounded-[16px] rounded-tl-sm px-4 py-3 max-w-[76%] flex flex-col gap-3">
      ${innerHTML}
    </div>`;
  chatArea.appendChild(el);
  scrollBottom();
  return el;
}

function appendUserBubble(text) {
  const el = document.createElement("div");
  el.className = "flex justify-end bubble-in";
  el.innerHTML = `<div class="bg-[#0D57E2] rounded-[16px] rounded-tr-sm px-4 py-3 max-w-[76%]">
    <p class="text-[14px] font-semibold text-white leading-[22px] tracking-[0.25px]">${escHtml(text)}</p>
  </div>`;
  chatArea.appendChild(el);
  scrollBottom();
}

function hideBubble(el) {
  if (!el) return;
  el.classList.add("hidden");
}

// ─── Menu helpers ─────────────────────────────────────────────────────────────
function pillsHTML(items, fnName, ...prefixArgs) {
  const pfx = prefixArgs.length ? prefixArgs.join(", ") + ", " : "";
  return items.map((item, i) =>
    `<button onclick="${fnName}(this, ${pfx}${i})"
      class="w-full bg-white rounded-full px-4 py-2 text-[14px] font-semibold text-[#4F4F4F] tracking-[0.25px] text-center active:bg-gray-100 transition-colors">
      ${escHtml(item.label)}
    </button>`
  ).join("");
}

function tripBtn() {
  return `<button onclick="askCurrentTrip(this)"
    class="w-full bg-white border border-[#0D57E2] rounded-full px-4 py-2 text-[14px] font-semibold text-[#0D57E2] tracking-[0.25px] flex items-center justify-center gap-2 active:bg-[#E7EEFC] transition-colors">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D57E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg)">
      <path d="M7 16V4m0 0L3 8m4-4l4 4"/>
      <path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
    </svg>
    สอบถามทริปปัจจุบัน
  </button>`;
}

// ─── Main menu ────────────────────────────────────────────────────────────────
function showMainMenu() {
  if (flowState) return; // ถ้ากำลัง flow อยู่ ไม่ขึ้น menu ซ้ำ
  hideBubble(currentChoiceBubble);
  currentChoiceBubble = null;
  disableInput();
  appendBotBubble(`
    <p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">
      สามารถเลือกหัวข้อที่ต้องการสอบถามจากเมนูด้านล่างได้เลยครับ!
    </p>
    <div class="flex flex-col gap-2">
      ${pillsHTML(MENU, "selectL0")}
      ${tripBtn()}
    </div>
  `);
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function selectL0(btn, i0) {
  const item = MENU[i0];
  hideBubble(btn.parentElement);
  appendUserBubble(item.label);
  if (item.sub) setTimeout(() => showSubMenu(item.sub, "selectL1", i0), 400);
  else setTimeout(() => runLeaf(item), 400);
}

function selectL1(btn, i0, i1) {
  const item = MENU[i0].sub[i1];
  hideBubble(btn.parentElement);
  appendUserBubble(item.label);
  if (item.sub) setTimeout(() => showSubMenu(item.sub, "selectL2", i0, i1), 400);
  else setTimeout(() => runLeaf(item), 400);
}

function selectL2(btn, i0, i1, i2) {
  const item = MENU[i0].sub[i1].sub[i2];
  hideBubble(btn.parentElement);
  appendUserBubble(item.label);
  setTimeout(() => runLeaf(item), 400);
}

function showSubMenu(items, fnName, ...args) {
  menuBtn.disabled = false;
  currentChoiceBubble = appendBotBubble(`
    <p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">กรุณาเลือกหัวข้อย่อยที่ต้องการครับ</p>
    <div class="flex flex-col gap-2">
      ${pillsHTML(items, fnName, ...args)}
    </div>
  `);
}

// ─── Leaf flow ────────────────────────────────────────────────────────────────
function runLeaf(item) {
  if (item.gather) {
    flowState = { item, stepIdx: 0 };
    appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(item.initial)}</p>`);
    setTimeout(() => advanceFlow(), 600);
  } else {
    appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(item.response)}</p>`);
    resetToDefault();
  }
}

function advanceFlow() {
  if (!flowState) return;
  const { item, stepIdx } = flowState;
  if (stepIdx >= item.gather.length) {
    if (item.closing) appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(item.closing)}</p>`);
    flowState = null;
    resetToDefault();
    return;
  }
  appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(item.gather[stepIdx].prompt)}</p>`);
  enableInput();
}

// ─── Input ────────────────────────────────────────────────────────────────────
function enableInput() {
  textInput.disabled = false;
  textInput.placeholder = "พิมพ์ข้อความ...";
  sendBtn.disabled = false;
  textInput.focus();
}

function resetToDefault() {
  textInput.disabled = true;
  textInput.value = "";
  textInput.placeholder = "Please select topic above first";
  sendBtn.disabled = true;
  menuBtn.disabled = false;
}

function disableInput() {
  textInput.disabled = true;
  textInput.value = "";
  textInput.placeholder = "Please select topic above first";
  menuBtn.disabled = true;
  sendBtn.disabled = true;
}

function sendMessage() {
  const val = textInput.value.trim();
  if (!val || textInput.disabled) return;
  textInput.value = "";
  appendUserBubble(val);
  if (flowState) {
    textInput.disabled = true;
    textInput.placeholder = "Please select topic above first";
    flowState.stepIdx++;
    setTimeout(() => advanceFlow(), 800);
  } else {
    textInput.disabled = true;
    sendBtn.disabled = true;
    setTimeout(() => {
      appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">ขอบคุณครับ ทีมงานได้รับข้อความแล้ว จะติดต่อกลับโดยเร็วที่สุดครับ</p>`);
      resetToDefault();
    }, 600);
  }
}

// ─── Navigate to trip chat ────────────────────────────────────────────────────
function askCurrentTrip(btn) {
  hideBubble(btn.parentElement);
  appendUserBubble("สอบถามทริปปัจจุบัน");
  setTimeout(() => { window.location.href = "trip-chat.html"; }, 400);
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function scrollBottom() {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
  });
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─── Init ─────────────────────────────────────────────────────────────────────
(function init() {
  appendBotBubble(`<p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">
    สวัสดีครับมีอะไรให้น้อง Muvmi ช่วยเหลือครับวันนี้
  </p>`);
  setTimeout(showMainMenu, 400);
})();
</script>
