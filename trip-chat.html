<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MuvMi – Trip Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f3f4f6; }
    #chat-area { scroll-behavior: smooth; }
    .bubble-in { animation: fadeUp 0.2s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="antialiased">

<div class="mx-auto max-w-[430px] h-screen bg-white shadow-md flex flex-col overflow-hidden">

  <!-- iOS Status Bar -->
  <div class="flex items-center justify-between px-4 pt-3 pb-1 shrink-0">
    <span class="text-[17px] font-semibold">9:41</span>
    <div class="w-20"></div>
    <div class="flex items-center gap-[5px]">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="black">
        <rect x="0" y="7" width="3" height="5" rx="1"/>
        <rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/>
        <rect x="9" y="2" width="3" height="10" rx="1"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="black">
        <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
        <path d="M3.5 6.3A6.5 6.5 0 0 1 12.5 6.3" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M1 3.7A10 10 0 0 1 15 3.7" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="black" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="16" height="8" rx="2" fill="black"/>
        <path d="M23 4v4a2 2 0 0 0 0-4z" fill="black" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Navigation Bar -->
  <div class="flex items-center justify-center relative h-14 border-b border-black/[0.08] shadow-[0px_1px_0px_rgba(0,0,0,0.08)] shrink-0">
    <button onclick="history.back()" class="absolute left-4 flex items-center justify-center w-6 h-6">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none">
        <path d="M9.5 1L1.5 9L9.5 17" stroke="#0D57E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="text-[20px] font-semibold text-[#4F4F4F] leading-[30px]">สก2305</h1>
  </div>

  <!-- Chat Area -->
  <div id="chat-area" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3"></div>

  <!-- Input Bar -->
  <div class="shrink-0 bg-white border-t border-[#E7EEFC] p-4">
    <div class="flex items-center gap-2">

      <!-- แจ้งปัญหา button (inline, show/hide) -->
      <div id="floating-report" class="shrink-0">
        <button onclick="openReportMenu()"
          class="bg-[#E7EEFC] text-[#0D57E2] rounded-full px-4 py-1.5 text-[15px] font-semibold tracking-[0.25px] whitespace-nowrap active:bg-blue-100 transition-colors">
          แจ้งปัญหา
        </button>
      </div>

      <input id="text-input" type="text" disabled
        placeholder="กรุณาเลือกปัญหาก่อน"
        class="flex-1 min-w-0 bg-[#EEE] border border-[#909090] rounded-full px-4 py-1 text-[14px] text-[#909090] placeholder-[#909090] outline-none
               disabled:bg-[#EEE] disabled:border-[#909090]
               enabled:bg-white enabled:border-[#0D57E2] enabled:text-[#4F4F4F] enabled:placeholder-gray-400"
        onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()" class="shrink-0 w-8 h-8 flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#0D57E2">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>

    </div>
  </div>

</div>

<script>
  const chatArea       = document.getElementById("chat-area");
  const floatingReport = document.getElementById("floating-report");
  const textInput      = document.getElementById("text-input");

  // ── Menu structure ────────────────────────────────────────────────────────
  // gather step types: "text" | "buttons" | "image_confirm"
  const MENU = [
    {
      label: "แจ้งเหตุรถเสีย อุบัติเหตุ",
      initial: "ขอบคุณที่แจ้งให้ทราบ เราเข้าใจว่านี่เป็นเรื่องเร่งด่วน",
      gather: [
        { type: "buttons", prompt: "ท่านปลอดภัยหรือไม่?",   options: ["ปลอดภัยดี", "ไม่ปลอดภัย"] },
        { type: "buttons", prompt: "มีผู้บาดเจ็บหรือไม่?",  options: ["ไม่มี", "มีผู้บาดเจ็บ"] },
      ],
      closing: "เจ้าหน้าที่ของเราจะติดต่อคุณในทันทีเพื่อช่วยเหลือ"
    },
    {
      label: "ร้องเรียนคนขับ",
      sub: [
        { label: "คนขับออกนอกเส้นทาง",
          initial: "รับทราบการร้องเรียน เราจะตรวจสอบทันที", gather: [], closing: null },
        { label: "คนขับจอดไม่ตรงจุด",
          initial: "รับทราบการร้องเรียน ขอให้ช่วยแจ้งรายละเอียด",
          gather: [
            { type: "buttons",      prompt: "เห็นตำแหน่งปัจจุบันของรถหรือไม่?", options: ["เห็น", "ไม่เห็น"] },
            { type: "image_confirm", src: "Frame 12.png",
              prompt: "คุณลูกค้าอยู่ที่จุดนี้ใช่มั้ยครับ?", options: ["ใช่", "ไม่ใช่"] },
          ],
          closing: "คนขับได้รับสัญญาณแล้ว เลื่อนมาจุดรับส่งที่ถูกต้อง" },
        { label: "ขับรถอันตราย",
          initial: "รับทราบการร้องเรียน สถานการณ์นี้เราถือว่าสำคัญ",
          gather: [{ type: "text", prompt: "กรุณาอธิบายวิธีการขับที่อันตราย" }],
          closing: "เราได้ติดต่อคนขับแล้ว หากปัญหายังเกิดขึ้น โปรดแจ้งให้ทราบ" },
        { label: "คนขับไม่รู้เส้นทาง",
          initial: "รับทราบ ขออภัยสำหรับความไม่สะดวก เราจะช่วยทันที",
          gather: [{ type: "text", prompt: "กรุณาแจ้งตำแหน่งปัจจุบันของท่าน" }],
          closing: "เราได้ส่งตำแหน่งที่ถูกต้องให้คนขับแล้ว" },
      ]
    },
    {
      label: "เปลี่ยนแปลงทริป",
      sub: [
        { label: "เปลี่ยนแปลงจุดรับส่ง",
          initial: "รับทราบการร้องขอเปลี่ยนแปลง ให้เราตรวจสอบการเปลี่ยนแปลงนั้นได้",
          gather: [{ type: "text", prompt: "ที่อยู่/สถานที่ใหม่คือที่ไหน?" }],
          closing: "เราได้อัปเดตจุดรับส่งแล้ว คนขับจะปรับเส้นทาง" },
        { label: "ยกเลิกทริป",
          initial: "รับทราบการร้องขอยกเลิก",
          gather: [{ type: "text", prompt: "กรุณาระบุเหตุผลในการยกเลิกทริป" }],
          closing: "ยกเลิกทริปเสร็จสิ้น" },
        { label: "เพิ่มจำนวนผู้โดยสาร",
          initial: "รับทราบการร้องขอ เราจะตรวจสอบ",
          gather: [{ type: "text", prompt: "ต้องการเพิ่มผู้โดยสารกี่คน?" }],
          closing: "อัปเดตจำนวนผู้โดยสารแล้ว" },
      ]
    },
    {
      label: "ติดตามรถ",
      sub: [
        { label: "รถไม่ขยับ",
          initial: "รับทราบความเป็นห่วง เราจะตรวจสอบทันที",
          gather: [{ type: "text", prompt: "รถนิ่งมานานแค่ไหนแล้วครับ?" }],
          closing: "เราติดต่อคนขับแล้ว จะเดินทางต่อในไม่ช้า" },
        { label: "รถมาล่าช้า",
          initial: "รับทราบและขออภัยสำหรับความไม่สะดวก",
          gather: [], closing: "ETA ประมาณ 5-10 นาที ขอบคุณสำหรับการรอ" },
        { label: "คนขับออกนอกเส้นทาง",
          initial: "รับทราบและติดตามทันที",
          gather: [], closing: "เราแจ้งให้คนขับกลับเส้นทางแล้ว ETA ประมาณ [เวลา]" },
      ]
    },
  ];

  const GENERAL = "สอบถามเรื่องอื่น/ทั่วไป";

  // Active gather flow: { issue, stepIdx }
  let flowState = null;

  // ── Avatar ────────────────────────────────────────────────────────────────
  function botAvatar() {
    return `<div class="w-9 h-9 rounded-full bg-[#0D57E2] flex items-center justify-center shrink-0 self-start mt-1">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="9" r="4" fill="white"/>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>`;
  }

  // ── Bubble builders ───────────────────────────────────────────────────────
  function appendBotMsg(contentHTML) {
    const el = document.createElement("div");
    el.className = "flex items-start gap-3 bubble-in";
    el.innerHTML = `${botAvatar()}
      <div class="flex flex-col gap-2 max-w-[80%]">
        ${contentHTML}
      </div>`;
    chatArea.appendChild(el);
    scrollBottom();
    return el;
  }

  function appendUserMsg(text) {
    const el = document.createElement("div");
    el.className = "flex justify-end bubble-in";
    el.innerHTML = `<div class="bg-[#0D57E2] rounded-[16px] rounded-tr-sm px-4 py-2 max-w-[72%]">
      <p class="text-[14px] text-white leading-[22px] tracking-[0.25px]">${escHtml(text)}</p>
    </div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function textBubble(text) {
    return `<div class="bg-[#E7EEFC] rounded-[16px] rounded-tl-sm px-4 py-2">
      <p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(text)}</p>
    </div>`;
  }

  function imageBubble(src, alt) {
    return `<div class="rounded-[16px] overflow-hidden">
      <img src="${src}" alt="${escHtml(alt)}" class="w-full object-cover" style="max-height:200px" />
    </div>`;
  }

  // ── Input bar state ───────────────────────────────────────────────────────
  function hideReportBtn() { floatingReport.classList.add("hidden"); }

  function enableInput() {
    textInput.disabled = false;
    textInput.placeholder = "พิมพ์ข้อความ...";
    textInput.focus();
  }

  function resetToReport() {
    textInput.disabled = true;
    textInput.value = "";
    textInput.placeholder = "กรุณาเลือกปัญหาก่อน";
    floatingReport.classList.remove("hidden");
    flowState = null;
  }

  function hideBubble(el) {
    if (!el) return;
    el.classList.add("hidden");
  }

  // ── Main menu ─────────────────────────────────────────────────────────────
  function openReportMenu() {
    hideReportBtn();

    const pills = MENU.map((item, i) =>
      `<button onclick="selectMenuItem(this, ${i})"
        class="w-full bg-white rounded-full px-4 py-2 text-[14px] font-semibold text-[#4F4F4F] tracking-[0.25px] text-center active:bg-gray-100 transition-colors">
        ${escHtml(item.label)}
      </button>`
    ).join("");

    const generalPill =
      `<button onclick="selectGeneralItem(this)"
        class="w-full bg-white border border-[#0D57E2] rounded-full px-4 py-2 text-[14px] font-semibold text-[#0D57E2] tracking-[0.25px] flex items-center justify-center gap-2 active:bg-[#E7EEFC] transition-colors">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0D57E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg);flex-shrink:0">
          <path d="M7 16V4m0 0L3 8m4-4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
        </svg>
        ${escHtml(GENERAL)}
      </button>`;

    appendBotMsg(
      `<div class="bg-[#E7EEFC] rounded-[16px] rounded-tl-sm px-4 py-3 flex flex-col gap-3">
        <p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">เลือกปัญหาที่ต้องการแจ้งด้านล่างได้เลยครับ</p>
        <div class="flex flex-col gap-2">
          ${pills}
          ${generalPill}
        </div>
      </div>`
    );
  }

  function selectMenuItem(btn, idx) {
    const item = MENU[idx];
    hideBubble(btn.parentElement);
    appendUserMsg(item.label);
    if (item.sub) {
      setTimeout(() => showSubMenu(idx), 400);
    } else {
      setTimeout(() => runLeafFlow(item), 400);
    }
  }

  function selectGeneralItem(btn) {
    hideBubble(btn.parentElement);
    appendUserMsg(GENERAL);
    setTimeout(() => { window.location.href = "support.html"; }, 400);
  }

  // ── Sub-menu ──────────────────────────────────────────────────────────────
  function showSubMenu(parentIdx) {
    const category = MENU[parentIdx];
    const pills = category.sub.map((item, i) =>
      `<button onclick="selectSubItem(this, ${parentIdx}, ${i})"
        class="w-full bg-white rounded-full px-4 py-2 text-[14px] font-semibold text-[#4F4F4F] tracking-[0.25px] text-center active:bg-gray-100 transition-colors">
        ${escHtml(item.label)}
      </button>`
    ).join("");
    appendBotMsg(
      `<div class="bg-[#E7EEFC] rounded-[16px] rounded-tl-sm px-4 py-3 flex flex-col gap-3">
        <p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">เลือกรายละเอียดปัญหา</p>
        <div class="flex flex-col gap-2">${pills}</div>
      </div>`
    );
  }

  function selectSubItem(btn, parentIdx, subIdx) {
    const item = MENU[parentIdx].sub[subIdx];
    hideBubble(btn.parentElement);
    appendUserMsg(item.label);
    setTimeout(() => runLeafFlow(item), 400);
  }

  // ── Leaf flow ─────────────────────────────────────────────────────────────
  function runLeafFlow(issue) {
    flowState = { issue, stepIdx: 0 };
    appendBotMsg(textBubble(issue.initial));
    setTimeout(() => advanceFlow(), 600);
  }

  function advanceFlow() {
    if (!flowState) return;
    const { issue, stepIdx } = flowState;

    if (stepIdx >= issue.gather.length) {
      if (issue.closing) appendBotMsg(textBubble(issue.closing));
      flowState = null;
      resetToReport();
      return;
    }

    const step = issue.gather[stepIdx];

    if (step.type === "text") {
      appendBotMsg(textBubble(step.prompt));
      enableInput();

    } else if (step.type === "buttons") {
      const btns = step.options.map((opt, i) =>
        `<button onclick="handleQuickReply(this, ${i})"
          class="w-full bg-white rounded-full px-3 py-1.5 text-[13px] font-semibold text-[#0D57E2] border border-[#0D57E2] active:bg-[#E7EEFC] transition-colors">
          ${escHtml(opt)}
        </button>`
      ).join("");
      appendBotMsg(
        `<div class="bg-[#E7EEFC] rounded-[16px] rounded-tl-sm px-4 py-3 flex flex-col gap-2">
          <p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(step.prompt)}</p>
          <div class="flex flex-col gap-2">${btns}</div>
        </div>`
      );

    } else if (step.type === "image_confirm") {
      const btns = step.options.map((opt, i) =>
        `<button onclick="handleQuickReply(this, ${i})"
          class="w-full bg-white rounded-full px-3 py-1.5 text-[13px] font-semibold text-[#0D57E2] border border-[#0D57E2] active:bg-[#E7EEFC] transition-colors">
          ${escHtml(opt)}
        </button>`
      ).join("");
      appendBotMsg(
        `<div class="bg-[#E7EEFC] rounded-[16px] rounded-tl-sm px-4 py-3 flex flex-col gap-2">
          <div class="rounded-[12px] overflow-hidden mb-1">
            <img src="${step.src}" alt="location" class="w-full object-cover" style="max-height:160px" />
          </div>
          <p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(step.prompt)}</p>
          <div class="flex flex-col gap-2">${btns}</div>
        </div>`
      );
    }
  }

  function handleQuickReply(btn, optionIdx) {
    if (!flowState) return;
    const step = flowState.issue.gather[flowState.stepIdx];
    hideBubble(btn.parentElement);
    appendUserMsg(step.options[optionIdx]);
    flowState.stepIdx++;
    setTimeout(() => advanceFlow(), 500);
  }

  // ── Send free-text message ────────────────────────────────────────────────
  function sendMessage() {
    const val = textInput.value.trim();
    if (!val || textInput.disabled) return;
    textInput.value = "";
    appendUserMsg(val);

    if (flowState && flowState.issue.gather[flowState.stepIdx]?.type === "text") {
      textInput.disabled = true;
      textInput.placeholder = "กรุณาเลือกปัญหาก่อน";
      flowState.stepIdx++;
      setTimeout(() => advanceFlow(), 800);
    } else {
      setTimeout(() => {
        appendBotMsg(textBubble("ได้รับข้อความแล้วครับ ทีมงานจะดำเนินการให้เร็วที่สุดครับ"));
        resetToReport();
      }, 800);
    }
  }

  // ── Utils ─────────────────────────────────────────────────────────────────
  function scrollBottom() {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  (function init() {
    appendBotMsg(
      textBubble("สก2305 กำลังไปรับผู้โดยสาร รอรถที่จุด pickup ได้เลยครับ") +
      imageBubble("Frame 12.png", "ตำแหน่งคนขับ")
    );
  })();
</script>
</body>
</html>
