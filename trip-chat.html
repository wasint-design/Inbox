<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MuvMi – Trip Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f3f4f6; }
    #chat-area { scroll-behavior: smooth; }
    .bubble-in { animation: fadeUp 0.2s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="antialiased">

<div class="mx-auto max-w-[430px] h-screen bg-white shadow-md flex flex-col overflow-hidden">

  <!-- iOS Status Bar -->
  <div class="flex items-center justify-between px-4 pt-3 pb-1 shrink-0">
    <span class="text-[17px] font-semibold">9:41</span>
    <div class="w-20"></div>
    <div class="flex items-center gap-[5px]">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="black">
        <rect x="0" y="7" width="3" height="5" rx="1"/>
        <rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/>
        <rect x="9" y="2" width="3" height="10" rx="1"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="black">
        <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
        <path d="M3.5 6.3A6.5 6.5 0 0 1 12.5 6.3" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M1 3.7A10 10 0 0 1 15 3.7" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="black" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="16" height="8" rx="2" fill="black"/>
        <path d="M23 4v4a2 2 0 0 0 0-4z" fill="black" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Navigation Bar -->
  <div class="flex items-center justify-center relative h-14 border-b border-black/[0.08] shadow-[0px_1px_0px_rgba(0,0,0,0.08)] shrink-0">
    <button onclick="history.back()" class="absolute left-4 flex items-center justify-center w-6 h-6">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none">
        <path d="M9.5 1L1.5 9L9.5 17" stroke="#0D57E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="text-[20px] font-semibold text-[#4F4F4F] leading-[30px]">สก2305</h1>
  </div>

  <!-- Chat Area -->
  <div id="chat-area" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3"></div>

  <!-- Input Bar -->
  <div class="shrink-0 bg-white border-t border-[#E7EEFC] px-3 py-2">

    <!-- State A: แจ้งปัญหา button -->
    <div id="bar-report" class="flex items-center justify-center">
      <button onclick="openReportMenu()"
        class="w-full bg-[#0D57E2] text-white rounded-full py-2 text-[15px] font-semibold tracking-[0.25px] active:bg-blue-700 transition-colors">
        แจ้งปัญหา
      </button>
    </div>

    <!-- State B: disabled input + send (hidden by default) -->
    <div id="bar-input" class="hidden flex items-center gap-2">
      <input id="text-input" type="text" disabled
        placeholder="เลือกปัญหาที่ต้องการแจ้งด้านบน"
        class="flex-1 min-w-0 bg-[#EEE] border border-[#909090] rounded-full px-4 py-1 text-[14px] text-[#909090] placeholder-[#909090] outline-none
               disabled:bg-[#EEE] disabled:border-[#909090]
               enabled:bg-white enabled:border-[#0D57E2] enabled:text-[#4F4F4F] enabled:placeholder-gray-400"
        onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()" class="shrink-0 w-8 h-8 flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#0D57E2">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>

  </div>

</div>

<script>
  const chatArea  = document.getElementById("chat-area");
  const barReport = document.getElementById("bar-report");
  const barInput  = document.getElementById("bar-input");
  const textInput = document.getElementById("text-input");

  // ── Problem options ───────────────────────────────────────────────────────
  const PROBLEMS = [
    { label: "รถไม่ขยับ",              preview: "รถหยุดนิ่ง ไม่เคลื่อนที่ หรือค้างอยู่ที่เดิม" },
    { label: "รถมาล่าช้า",             preview: "รถมาถึงช้ากว่ากำหนดอย่างมีนัยสำคัญ" },
    { label: "คนขับออกนอกเส้นทาง",     preview: "คนขับขับรถออกนอกเส้นทางที่กำหนดไว้" },
    { label: "คนขับจอดไม่ตรงจุด",      preview: "คนขับจอดรับ-ส่งไม่ตรงจุดที่กำหนด" },
    { label: "ขับรถอันตราย",            preview: "ขับเร็วเกินไปหรือขับแบบประมาท" },
    { label: "คนขับไม่รู้เส้นทาง",     preview: "คนขับไม่คุ้นเคยกับเส้นทางในพื้นที่" },
    { label: "แจ้งแก้ไขข้อมูลจุด",     preview: "ข้อมูลจุดรับ-ส่งไม่ถูกต้องหรือล้าสมัย" },
  ];

  // "สอบถามเรื่องอื่น/ทั่วไป" is special — enables free text
  const GENERAL = "สอบถามเรื่องอื่น/ทั่วไป";

  // ── Avatar ────────────────────────────────────────────────────────────────
  function botAvatar() {
    return `<div class="w-9 h-9 rounded-full bg-[#0D57E2] flex items-center justify-center shrink-0 self-start mt-1">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="9" r="4" fill="white"/>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>`;
  }

  // ── Bubble builders ───────────────────────────────────────────────────────
  function appendBotMsg(contentHTML) {
    const el = document.createElement("div");
    el.className = "flex items-start gap-3 bubble-in";
    el.innerHTML = `${botAvatar()}
      <div class="flex flex-col gap-2 max-w-[72%]">
        ${contentHTML}
      </div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function appendUserMsg(text) {
    const el = document.createElement("div");
    el.className = "flex justify-end bubble-in";
    el.innerHTML = `<div class="bg-[#0D57E2] rounded-[16px] rounded-tr-sm px-4 py-2 max-w-[72%]">
      <p class="text-[14px] text-white leading-[22px] tracking-[0.25px]">${escHtml(text)}</p>
    </div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function textBubble(text) {
    return `<div class="bg-[#E7EEFC] rounded-[16px] rounded-tl-sm px-4 py-2">
      <p class="text-[14px] font-semibold text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(text)}</p>
    </div>`;
  }

  function imageBubble(src, alt) {
    return `<div class="rounded-[16px] overflow-hidden">
      <img src="${src}" alt="${escHtml(alt)}" class="w-full object-cover" style="max-height:200px" />
    </div>`;
  }

  // ── Input bar state ───────────────────────────────────────────────────────
  function switchToInput() {
    barReport.classList.add("hidden");
    barInput.classList.remove("hidden");
  }

  function enableInput() {
    textInput.disabled = false;
    textInput.placeholder = "พิมพ์ข้อความ...";
    textInput.focus();
  }

  function lockBubble(el) {
    el.querySelectorAll("button").forEach(b => {
      b.disabled = true;
      b.classList.add("opacity-40", "cursor-not-allowed");
    });
  }

  // ── Open problem menu ─────────────────────────────────────────────────────
  function openReportMenu() {
    switchToInput(); // swap button → disabled input

    // Exact same row template as index.html renderMessages()
    const rows = PROBLEMS.map(p =>
      `<button onclick="selectProblem(this, '${p.label.replace(/'/g, "\\'")}')"
        class="relative w-full flex flex-col gap-1 px-4 py-4 border-b border-[#EEEEEE] active:bg-gray-50 cursor-pointer text-left">
        <span class="text-[16px] font-semibold text-[#4F4F4F] tracking-[0.25px] leading-6">${escHtml(p.label)}</span>
        <span class="text-[14px] font-medium text-[#909090] tracking-[0.25px] leading-[22px] truncate">${escHtml(p.preview)}</span>
      </button>`
    ).join("");

    const generalRow =
      `<button onclick="selectProblem(this, '${GENERAL}')"
        class="relative w-full flex flex-col gap-1 px-4 py-4 active:bg-gray-50 cursor-pointer text-left">
        <span class="flex items-center gap-2 text-[16px] font-semibold text-[#0D57E2] tracking-[0.25px] leading-6">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0D57E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg);flex-shrink:0">
            <path d="M7 16V4m0 0L3 8m4-4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
          </svg>
          ${escHtml(GENERAL)}
        </span>
        <span class="text-[14px] font-medium text-[#909090] tracking-[0.25px] leading-[22px]">พิมพ์ข้อความสอบถามเพิ่มเติม</span>
      </button>`;

    appendBotMsg(
      textBubble("เลือกปัญหาที่ต้องการแจ้งด้านล่างได้เลยครับ") +
      `<div class="bg-white rounded-[16px] overflow-hidden border border-[#EEEEEE]">
        ${rows}
        ${generalRow}
      </div>`
    );
  }

  // ── Select a problem ──────────────────────────────────────────────────────
  function selectProblem(btn, problem) {
    lockBubble(btn.closest(".flex.items-start"));
    appendUserMsg(problem);

    if (problem === GENERAL) {
      // Enable free-text input
      setTimeout(() => {
        appendBotMsg(textBubble("กรุณาพิมพ์รายละเอียดที่ต้องการสอบถามได้เลยครับ"));
        enableInput();
      }, 500);
    } else {
      // Confirm receipt, keep input disabled
      setTimeout(() => {
        appendBotMsg(textBubble(`รับทราบครับ ได้บันทึกปัญหา "${problem}" แล้ว ทีมงานจะดำเนินการให้เร็วที่สุดครับ`));
      }, 500);
    }
  }

  // ── Send free-text message ────────────────────────────────────────────────
  function sendMessage() {
    const val = textInput.value.trim();
    if (!val || textInput.disabled) return;
    textInput.value = "";
    appendUserMsg(val);
    setTimeout(() => {
      appendBotMsg(textBubble("ได้รับข้อความแล้วครับ ทีมงานจะดำเนินการให้เร็วที่สุดครับ"));
    }, 800);
  }

  // ── Utils ─────────────────────────────────────────────────────────────────
  function scrollBottom() {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Init: mock conversation ───────────────────────────────────────────────
  (function init() {
    appendBotMsg(
      textBubble("สก2305 กำลังไปรับผู้โดยสาร รอรถที่จุด pickup ได้เลยครับ") +
      imageBubble("Frame 12.png", "ตำแหน่งคนขับ")
    );
    // input starts hidden; แจ้งปัญหา button is shown
  })();
</script>
</body>
</html>
