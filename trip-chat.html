<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MuvMi – Trip Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f3f4f6; }
    #chat-area { scroll-behavior: smooth; }
    .bubble-in { animation: fadeUp 0.2s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="antialiased">

<div class="mx-auto max-w-[430px] h-screen bg-white shadow-md flex flex-col overflow-hidden">

  <!-- iOS Status Bar -->
  <div class="flex items-center justify-between px-4 pt-3 pb-1 shrink-0">
    <span class="text-[17px] font-semibold">9:41</span>
    <div class="w-20"></div>
    <div class="flex items-center gap-[5px]">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="black">
        <rect x="0" y="7" width="3" height="5" rx="1"/>
        <rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/>
        <rect x="9" y="2" width="3" height="10" rx="1"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="black">
        <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
        <path d="M3.5 6.3A6.5 6.5 0 0 1 12.5 6.3" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M1 3.7A10 10 0 0 1 15 3.7" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="black" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="16" height="8" rx="2" fill="black"/>
        <path d="M23 4v4a2 2 0 0 0 0-4z" fill="black" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Navigation Bar -->
  <div class="flex items-center justify-center relative h-14 border-b border-black/[0.08] shadow-[0px_1px_0px_rgba(0,0,0,0.08)] shrink-0">
    <button onclick="history.back()" class="absolute left-4 flex items-center justify-center w-6 h-6">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none">
        <path d="M9.5 1L1.5 9L9.5 17" stroke="#0D57E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="flex flex-col items-center">
      <h1 class="text-[17px] font-semibold text-[#4F4F4F] leading-[22px]">Trip Chat</h1>
      <span class="text-[12px] text-[#0D57E2] leading-[16px]">กำลังเดินทาง</span>
    </div>
  </div>

  <!-- Trip Info Banner -->
  <div id="trip-banner" class="shrink-0 bg-[#E7EEFC] border-b border-[#C5D8F9] px-4 py-3 cursor-pointer" onclick="toggleBanner()">
    <div class="flex items-center justify-between mb-1">
      <div class="flex items-center gap-2">
        <!-- car icon -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D57E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l2-4h12l2 4h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/>
          <circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/>
        </svg>
        <span class="text-[13px] font-semibold text-[#0D57E2] tracking-[0.25px]">Toyota Commuter · กข-1234</span>
      </div>
      <svg id="banner-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D57E2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </div>
    <div id="banner-detail">
      <div class="flex items-baseline gap-1 mt-1">
        <span class="text-[12px] text-[#0D57E2] shrink-0 leading-[18px]">From :</span>
        <span class="text-[13px] text-[#4F4F4F] leading-[18px] truncate">Wat Pho, Bangkok</span>
      </div>
      <div class="flex items-baseline gap-1">
        <span class="text-[12px] text-[#0D57E2] shrink-0 leading-[18px] pl-[3px]">To :</span>
        <span class="text-[13px] text-[#4F4F4F] leading-[18px] truncate">12 Reclining Buddha Lane</span>
      </div>
      <div class="flex items-center gap-1 mt-1">
        <span class="inline-flex items-center gap-1 bg-[#0D57E2] text-white text-[11px] font-semibold px-2 py-0.5 rounded-full">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          ETA 8 นาที
        </span>
        <span class="text-[12px] text-[#909090]">· คนขับกำลังมา</span>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div id="chat-area" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3"></div>

  <!-- Input Bar -->
  <div class="shrink-0 bg-white border-t border-[#E7EEFC] px-3 py-2">
    <div class="flex items-center gap-2">
      <input id="text-input" type="text"
        placeholder="พิมพ์ข้อความ..."
        class="flex-1 min-w-0 bg-white border border-[#0D57E2] rounded-full px-4 py-1 text-[14px] text-[#4F4F4F] placeholder-gray-400 outline-none"
        onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()" class="shrink-0 w-8 h-8 flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#0D57E2">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  const chatArea  = document.getElementById("chat-area");
  const textInput = document.getElementById("text-input");
  let bannerOpen  = true;

  // ── Avatars ───────────────────────────────────────────────────────────────
  function botAvatar() {
    return `<div class="w-9 h-9 rounded-full bg-[#0D57E2] flex items-center justify-center shrink-0 self-end mb-1">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="9" r="4" fill="white"/>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>`;
  }

  function driverAvatar() {
    return `<div class="w-9 h-9 rounded-full bg-[#F0F0F0] flex items-center justify-center shrink-0 self-end mb-1">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" fill="#4F4F4F"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#4F4F4F" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>`;
  }

  // ── Bubble builders ───────────────────────────────────────────────────────
  function appendSystemMsg(text) {
    const el = document.createElement("div");
    el.className = "flex justify-center bubble-in";
    el.innerHTML = `<span class="text-[11px] text-[#909090] bg-gray-100 rounded-full px-3 py-1">${escHtml(text)}</span>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function appendBotMsg(text, avatar = botAvatar()) {
    const el = document.createElement("div");
    el.className = "flex items-end gap-2 bubble-in";
    el.innerHTML = `${avatar}
      <div class="max-w-[72%]">
        <div class="bg-[#E7EEFC] rounded-[16px] rounded-bl-sm px-4 py-2">
          <p class="text-[14px] text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(text)}</p>
        </div>
        <span class="text-[11px] text-[#909090] ml-2">${timestamp()}</span>
      </div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function appendDriverMsg(text) {
    const el = document.createElement("div");
    el.className = "flex items-end gap-2 bubble-in";
    el.innerHTML = `${driverAvatar()}
      <div class="max-w-[72%]">
        <p class="text-[11px] text-[#909090] ml-1 mb-0.5">คนขับ</p>
        <div class="bg-white border border-[#EEEEEE] rounded-[16px] rounded-bl-sm px-4 py-2">
          <p class="text-[14px] text-[#4F4F4F] leading-[22px] tracking-[0.25px]">${escHtml(text)}</p>
        </div>
        <span class="text-[11px] text-[#909090] ml-2">${timestamp()}</span>
      </div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function appendUserMsg(text) {
    const el = document.createElement("div");
    el.className = "flex justify-end bubble-in";
    el.innerHTML = `<div class="max-w-[72%]">
        <div class="bg-[#0D57E2] rounded-[16px] rounded-br-sm px-4 py-2">
          <p class="text-[14px] text-white leading-[22px] tracking-[0.25px]">${escHtml(text)}</p>
        </div>
        <span class="text-[11px] text-[#909090] text-right block mr-1">${timestamp()}</span>
      </div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  function sendMessage() {
    const val = textInput.value.trim();
    if (!val) return;
    textInput.value = "";
    appendUserMsg(val);
    setTimeout(() => {
      appendBotMsg("ได้รับข้อความแล้วครับ ทีมงานจะดำเนินการให้เร็วที่สุดครับ");
    }, 800);
  }

  function toggleBanner() {
    bannerOpen = !bannerOpen;
    document.getElementById("banner-detail").style.display  = bannerOpen ? "" : "none";
    document.getElementById("banner-chevron").style.transform = bannerOpen ? "" : "rotate(-90deg)";
  }

  // ── Utils ─────────────────────────────────────────────────────────────────
  function scrollBottom() {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
    });
  }

  function timestamp() {
    const now = new Date();
    return now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Init: mock conversation ───────────────────────────────────────────────
  (function init() {
    appendSystemMsg("เริ่มต้นการเดินทาง · 09:00 AM");
    setTimeout(() => appendBotMsg("สวัสดีครับ! ทริปของคุณได้เริ่มต้นแล้ว คนขับกำลังมารับคุณครับ"), 200);
    setTimeout(() => appendDriverMsg("สวัสดีครับ ผมกำลังมารับคุณอยู่นะครับ อีกประมาณ 8 นาทีครับ"), 600);
    setTimeout(() => appendSystemMsg("คนขับรับทราบการจอง"), 900);
    textInput.focus();
  })();
</script>
</body>
</html>
